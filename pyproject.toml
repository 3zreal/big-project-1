[project]
name = "big-project-1"
version = "0.1.0"
description = "YouTube data pipeline: YouTube Data API v3 → Python → BigQuery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
    "beautifulsoup4",
    "python-dotenv",
    "google-api-python-client",
    "google-cloud-bigquery",
    "pandas-gbq",
    "pyarrow",
    "google-auth",
]

[project.scripts]
yt-pipeline = "main:main"
yt-demo-fetch = "scripts.demo_fetch:main"
yt-freeze-artist-100 = "scripts.fetch_artist_100:main"
yt-resolve-channels = "scripts.resolve_channels.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installing the project is what makes `etl` and `scripts` importable from any
# working directory, so entrypoints do not have to patch sys.path.
packages = ["etl", "scripts"]
# main.py stays at the repo root (the assignment layout), so ship it explicitly.
force-include = { "main.py" = "main.py" }
